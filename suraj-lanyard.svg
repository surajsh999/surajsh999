<svg xmlns="http://www.w3.org/2000/svg" width="340" height="470" viewBox="0 0 340 470" fill="none" role="img" aria-label="Nikkat Afrin ID badge">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="av" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#0e3a4d"/>
      <stop offset="1" stop-color="#071722"/>
    </radialGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- pivot at top center; whole assembly swings like a pendulum -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-4 170 16; 4 170 16; -4 170 16" dur="4.6s"
      calcMode="spline" keyTimes="0;0.5;1"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>

    <!-- lanyard ribbon -->
    <path d="M170 16 L120 150" stroke="url(#strap)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M170 16 L220 150" stroke="url(#strap)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <circle cx="170" cy="16" r="7" fill="#0a2531" stroke="#22d3ee" stroke-width="2"/>
    <!-- clip -->
    <rect x="158" y="140" width="24" height="20" rx="4" fill="#0a2531" stroke="#22d3ee" stroke-width="2"/>

    <!-- card body -->
    <g filter="url(#g)">
      <rect x="55" y="158" width="230" height="290" rx="18" fill="url(#card)" stroke="#1c4a5f" stroke-width="1.5"/>
    </g>
    <rect x="55" y="158" width="230" height="290" rx="18" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.5"/>
    <!-- slot -->
    <rect x="150" y="172" width="40" height="8" rx="4" fill="#0a1a24" stroke="#22d3ee" stroke-width="1"/>

    <!-- header band -->
    <rect x="55" y="196" width="230" height="26" fill="#0a2b39"/>
    <text x="170" y="214" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" letter-spacing="3" fill="#7dd3fc">AI / DATA ENGINEER</text>

    <!-- avatar with mini mesh -->
    <circle cx="170" cy="272" r="42" fill="url(#av)" stroke="#22d3ee" stroke-width="2"/>
    <g stroke="#38bdf8" stroke-width="0.6" opacity="0.55">
      <line x1="150" y1="258" x2="190" y2="258"/>
      <line x1="150" y1="272" x2="190" y2="272"/>
      <line x1="150" y1="286" x2="190" y2="286"/>
      <line x1="160" y1="248" x2="160" y2="296"/>
      <line x1="180" y1="248" x2="180" y2="296"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="160" cy="258" r="1.8"/><circle cx="180" cy="258" r="1.8"/>
      <circle cx="170" cy="272" r="1.8"/><circle cx="160" cy="286" r="1.8"/><circle cx="180" cy="286" r="1.8"/>
    </g>
    <text x="170" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="20" fill="#e6f6ff" opacity="0.92">NA</text>
    <!-- scanning ring -->
    <circle cx="170" cy="272" r="48" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 170 272" to="360 170 272" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- name + title -->
    <text x="170" y="344" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="22" fill="#e6f6ff">NIKKAT AFRIN</text>
    <text x="170" y="366" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="url(#cy)">Peblink &#183; New York</text>

    <!-- divider -->
    <line x1="80" y1="380" x2="260" y2="380" stroke="#1c4a5f" stroke-width="1"/>

    <!-- id row -->
    <text x="80" y="402" font-family="'Courier New',monospace" font-size="11" fill="#8fb6c9">ID</text>
    <text x="260" y="402" text-anchor="end" font-family="'Courier New',monospace" font-size="11" fill="#a5f3fc">NA-2025-IJCNN</text>
    <text x="80" y="420" font-family="'Courier New',monospace" font-size="11" fill="#8fb6c9">CLR</text>
    <text x="260" y="420" text-anchor="end" font-family="'Courier New',monospace" font-size="11" fill="#a5f3fc">AI &#183; DATA &#183; MLOps</text>

    <!-- barcode -->
    <g fill="#a5f3fc">
      <rect x="80" y="430" width="2" height="10"/><rect x="84" y="430" width="1" height="10"/><rect x="87" y="430" width="3" height="10"/>
      <rect x="92" y="430" width="1" height="10"/><rect x="95" y="430" width="2" height="10"/><rect x="99" y="430" width="4" height="10"/>
      <rect x="105" y="430" width="1" height="10"/><rect x="108" y="430" width="2" height="10"/><rect x="112" y="430" width="3" height="10"/>
      <rect x="117" y="430" width="1" height="10"/><rect x="120" y="430" width="2" height="10"/><rect x="124" y="430" width="1" height="10"/>
      <rect x="127" y="430" width="3" height="10"/><rect x="132" y="430" width="2" height="10"/><rect x="136" y="430" width="1" height="10"/>
      <rect x="139" y="430" width="4" height="10"/><rect x="145" y="430" width="1" height="10"/><rect x="148" y="430" width="2" height="10"/>
    </g>
    <text x="260" y="440" text-anchor="end" font-family="'Courier New',monospace" font-size="9" letter-spacing="2" fill="#5f8497">VERIFIED</text>
  </g>
</svg>
